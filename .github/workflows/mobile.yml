name: mobile

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node --test tests/protocol.test.mjs
      - run: npm run build

  android:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android }
      - run: npm ci
      - run: npx tauri android init --ci
      - run: npx tauri android build --apk --aab
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: src-tauri/gen/android/app/build/outputs/**/*.apk
          if-no-files-found: error

  # iOS tạm tắt — cần Apple signing secrets. Mở lại khi đã cấu hình certificate + provisioning profile.
